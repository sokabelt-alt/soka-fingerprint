document.getElementById('adminBtn').onclick=async()=>{if(admin){await supabaseClient.auth.signOut();admin=false;render();return}openAdminLogin()};function openAdminLogin(){const w=lang==='en'?{title:'Owner sign in',email:'Email',pass:'Password',button:'Sign in',help:'Sign in with the owner account created in Supabase.'}:lang==='ar'?{title:'دخول المالك',email:'البريد الإلكتروني',pass:'كلمة المرور',button:'دخول',help:'سجّل الدخول بحساب المالك الذي أنشأته في Supabase.'}:{title:'چوونەژوورەوەی خاوەندار',email:'ئیمەیڵ',pass:'وشەی نهێنی',button:'چوونەژوورەوە',help:'بە هەژماری خاوەنداری دروستکراو لە Supabase بچۆ ژوورەوە.'};openModal(`<h2>${w.title}</h2><p>${w.help}</p><div class="field"><label>${w.email}</label><input id="ownerEmailInput" type="email" autocomplete="username" dir="ltr"></div><div class="field"><label>${w.pass}</label><input id="ownerPassInput" type="password" autocomplete="current-password"></div><div class="notice" id="err"></div><div class="actions"><button onclick="closeModal()">${t('close')}</button><button class="save" onclick="submitAdmin()">${w.button}</button></div>`);document.getElementById('ownerEmailInput').focus()}async function submitAdmin(){const email=document.getElementById('ownerEmailInput').value.trim(),password=document.getElementById('ownerPassInput').value,err=document.getElementById('err');const {data:result,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){err.textContent=lang==='en'?'Email or password is incorrect.':lang==='ar'?'البريد الإلكتروني أو كلمة المرور غير صحيحة.':'ئیمەیڵ یان وشەی نهێنی هەڵەیە.';err.style.display='block';return}if(result.user.id!==OWNER_UID){await supabaseClient.auth.signOut();err.textContent=lang==='en'?'This account does not match the owner UID configured for this site.':lang==='ar'?'هذا الحساب لا يطابق معرّف المالك المحدد للموقع.':'ئەم هەژمارە UIDـی خاوەنداری ئەم وێبسایتە نییە.';err.style.display='block';return}admin=true;await loadCloudContent();closeModal();render()}document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();if(!admin)openAdminLogin()}});function videoForm(i){let v=data.videos[i];openModal(`<h2>${t('edit')} · ${t('video')} ${String(i+1).padStart(2,'0')}</h2><div class="field"><label>${t('videoTitle')}</label><input id="vtitle" value="${esc(v.title)}"></div><div class="field"><label>${t('videoDesc')}</label><input id="vdesc" value="${esc(v.description)}"></div><div class="field"><label>${t('videoFile')}</label><input id="vfile" type="file" accept="video/*"></div><p style="color:var(--muted);font-size:12px">${t('videoFileHelp')}</p><div class="field"><label>${t('videoUrl')}</label><input id="vurl" value="${esc(v.url)}" dir="ltr"></div><div class="field"><label>${t('thumb')}</label><input id="vthumb" value="${esc(v.thumb)}" dir="ltr"></div><div class="actions"><button onclick="closeModal()">${t('close')}</button><button class="save" onclick="saveVideo(${i})">${t('save')}</button></div>`)}async function saveVideo(i){const title=document.getElementById('vtitle').value.trim(),file=document.getElementById('vfile').files[0],link=document.getElementById('vurl').value.trim();if(!title||(!file&&!link)){alert(lang==='en'?'Enter a title and choose a gallery video or provide a link.':lang==='ar'?'أدخل العنوان واختر فيديو من المعرض أو أضف رابطاً.':'ناونیشان بنووسە و ڤیدیۆیەک لە گەلەری هەڵبژێرە یان لینکێک دابنێ.');return}let url=link;if(file){const langCode=i<3?'ckb':i<6?'ar':'en',slot=(i%3)+1,path=`${langCode}/${slot}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,{error:uploadError}=await supabaseClient.storage.from('soka-videos').upload(path,file,{upsert:true,contentType:file.type||'video/mp4'});if(uploadError){alert((lang==='en'?'Upload failed: ':lang==='ar'?'فشل رفع الملف: ':'بارکردنی فایل سەرکەوتوو نەبوو: ')+uploadError.message);return}url=supabaseClient.storage.from('soka-videos').getPublicUrl(path).data.publicUrl}const row={language:i<3?'ckb':i<6?'ar':'en',slot:(i%3)+1,title,description:document.getElementById('vdesc').value.trim(),video_url:url,thumbnail_url:document.getElementById('vthumb').value.trim(),published:true};const {error}=await supabaseClient.from('videos').upsert(row,{onConflict:'language,slot'});if(error){alert(error.message);return}await loadCloudContent();closeModal();render()}function platformForm(i=-1){let p=i<0?{name:'',url:'',image:'',sort_order:data.platforms.length}:data.platforms[i];openModal(`<h2>${t('addPlatform')}</h2><div class="field"><label>${t('platformName')}</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>${t('platformUrl')}</label><input id="purl" value="${esc(p.url)}" dir="ltr"></div><div class="field"><label>${t('platformImage')}</label><input id="pimage" value="${esc(p.image||'')}" dir="ltr"></div><div class="actions"><button onclick="closeModal()">${t('close')}</button><button class="save" onclick="addPlatform(${i})">${t('save')}</button></div>`)}async function addPlatform(i=-1){const name=document.getElementById('pname').value.trim(),url=document.getElementById('purl').value.trim(),image=document.getElementById('pimage').value.trim();if(!name||!url)return;const row={name,url,image_url:image,published:true,sort_order:i<0?data.platforms.length:(data.platforms[i].sort_order||0)};let result;if(i<0)result=await supabaseClient.from('platforms').insert(row);else result=await supabaseClient.from('platforms').update(row).eq('id',data.platforms[i].id);if(result.error){alert(result.error.message);return}await loadCloudContent();closeModal();render()}async function delPlatform(i){const {error}=await supabaseClient.from('platforms').delete().eq('id',data.platforms[i].id);if(error){alert(error.message);return}await loadCloudContent();render()}document.getElementById('year').textContent=new Date().getFullYear();setLang('ckb');initializeCloud();
</script></body></html>
